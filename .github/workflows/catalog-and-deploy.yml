# Validación de catálogo + tests + deploy Cloud Run (DB2S-GEO 0.2)

name: catalog-and-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e .
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-report
          path: catalog/reports/latest_validation.json

  unit-tests:
    needs: validate-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m pytest tests/unit -q

  # Activar con variable de repo DEPLOY_CLOUD_RUN=true + secret GCP_SA_KEY
  # (clave JSON de service account creada en la consola de GCP, sin CLI).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_CLOUD_RUN == 'true'
    needs: [validate-catalog, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (service account key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy Cloud Run
        env:
          REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.GCP_SERVICE || 'db2s-geo' }}
        run: |
          set -euo pipefail
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          TAG="gcr.io/${PROJECT_ID}/${SERVICE}:${GITHUB_SHA}"
          gcloud config set project "${PROJECT_ID}"
          gcloud builds submit --tag "${TAG}"
          gcloud run deploy "${SERVICE}" \
            --image "${TAG}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --port 8080 \
            --set-env-vars "ENVIRONMENT=release,TELEMETRY_DB_PATH=/tmp/telemetry/queries.db"
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --format='value(status.url)')
          echo "Deployed to: ${URL}"
          echo ""
          echo "=== Smoke tests ==="
          curl -fsS "${URL}/healthz" && echo "  PASS healthz"
          curl -fsS "${URL}/version" && echo "  PASS version"
          curl -fsS "${URL}/graph/stats" && echo "  PASS graph/stats"
          EXPECTED=$(python -c "import json,glob;print(sum(1 for p in glob.glob('catalog/sources/*.json') if json.load(open(p,encoding='utf-8')).get('status')=='active'))")
          curl -fsS "${URL}/sources" | EXPECTED="${EXPECTED}" python -c "import sys,json,os; d=json.load(sys.stdin); assert d['count']==int(os.environ['EXPECTED']), f'Expected {os.environ[\"EXPECTED\"]} sources, got {d[\"count\"]}'" && echo "  PASS sources (${EXPECTED})"
          curl -fsS "${URL}/sources/dimar" | python -c "import sys,json; d=json.load(sys.stdin); assert d['source']=='DIMAR'" && echo "  PASS DIMAR"
          curl -fsS "${URL}/sources/global-forest-watch" | python -c "import sys,json; d=json.load(sys.stdin); assert d['source']=='Global Forest Watch'" && echo "  PASS GFW"
          curl -fsS "${URL}/sources/asf" | python -c "import sys,json; d=json.load(sys.stdin); assert d['source']=='ASF'" && echo "  PASS ASF"
          curl -fsS "${URL}/sources/soilgrids" | python -c "import sys,json; d=json.load(sys.stdin); assert d['source']=='SoilGrids'" && echo "  PASS SoilGrids"
          curl -fsS "${URL}/workbench/" | python -c "import sys; assert sys.stdin.read()" && echo "  PASS workbench"
          echo ""
          echo "All smoke tests passed"
